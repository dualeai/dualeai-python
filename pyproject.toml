[project]
name = "dualeai"
version = "0.1.0" # Overwritten by CI from the git tag; see cicd/version.sh and .github/workflows/release.yml
description = "Async Python SDK for managed Duale AI Tasks and customer-hosted Tools"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10" # Minimum is 3.10; advertised/tested CPython support is 3.10–3.14. Revisit after 3.10 EOL.
authors = [{ name = "Duale AI" }]
keywords = ["ai-agents", "agent-sdk", "dualeai", "structured-output", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles~=24.1.0",
    "aiohttp~=3.13",  # HTTP/SSE transport
    "hpke-http[aiohttp]~=4.0",  # Protected Task, Agent, and Library metadata traffic
    "aiojobs~=1.4",
    "aiosqlite~=0.20",
    "opentelemetry-api~=1.44",
    "opentelemetry-exporter-otlp-proto-http~=1.44",
    "opentelemetry-sdk~=1.44",
    "pydantic-settings~=2.10",
    # Generated optional-but-non-null fields use Field(exclude_if=...), added in 2.12.
    "pydantic~=2.12",
    "python-dotenv~=1.0",
    "redis[hiredis]~=5.2",
    "structlog~=25.3",
    "tenacity~=9.0",  # Retry with jitter for SSE reconnection
    "typing-extensions~=4.12",
    "uuid-utils~=0.11",
]

[project.optional-dependencies]
# Makes process-wide aiohttp/Redis/SQLite/system-metrics instrumentors available.
# Installation alone does not activate them: SDK observability configuration and its
# separate token are still required. Core OpenTelemetry tracing/metrics dependencies
# remain part of the base install.
telemetry = [
    "opentelemetry-instrumentation~=0.65b0",
    "opentelemetry-instrumentation-aiohttp-client~=0.65b0",
    "opentelemetry-instrumentation-redis~=0.65b0",
    "opentelemetry-instrumentation-sqlite3~=0.65b0",
    "opentelemetry-instrumentation-system-metrics~=0.65b0",
]
dev = [
    "dualeai[telemetry]",  # tests exercise the instrumentation path
    "aioboto3~=15.5",  # S3 client for presigned URL generation in tests
    "aioresponses~=0.7",  # aiohttp mocking
    "freezegun~=1.5",
    "moto[s3,server]~=5.1",  # Local S3 server for upload integration tests
    "hypothesis~=6.151",
    "packaging~=24.2",
    "psutil~=7.1",
    "ty~=0.0",
    "pytest-aiohttp~=1.1",  # Test server fixtures
    "pytest-socket~=0.7",  # Enforce self-contained tests (no real network egress)
    "pytest-asyncio~=1.3",
    "pytest-codspeed~=4.3",
    "pytest-cov~=7.1",
    "pytest-repeat~=0.9",
    "pytest-timeout~=2.4",
    "pytest-xdist[psutil]~=3.8",
    "pytest~=9.1",
    "ruff~=0.7",
    "toml~=0.10",
    "trustme~=1.2",  # Ephemeral loopback TLS certificates for hpke-http integration tests
    "twine~=6.0",
    "vulture~=2.14",
]

[project.urls]
Homepage = "https://duale.ai"
Repository = "https://github.com/dualeai/dualeai-python.git"
"Release notes" = "https://github.com/dualeai/dualeai-python/releases"
Issues = "https://github.com/dualeai/dualeai-python/issues"
Security = "https://github.com/dualeai/dualeai-python/security/policy"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dualeai*"]

[tool.setuptools.package-data]
dualeai = ["py.typed"]


[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
# Vulture whitelist uses intentionally undefined names (vulture pattern) — exclude from ty
exclude = ["vulture_whitelist.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=dualeai",               # Package name
    "--cov-report=term-missing", # Show missing lines in terminal
    "--cov-report=html",         # Generate HTML report
    "--cov-fail-under=90",       # Require 90% minimum coverage
    "--tb=short",                # Short traceback format
    "-v",                        # Verbose output, easier LLM debugging
    "--strict-markers",          # Ensure all markers are registered
    "-n",                        # Run tests in parallel
    "auto",                      # Use all available CPUs
    "--ignore=tests/benchmarks", # Benchmarks run separately via test-bench
    "--disable-socket",          # Self-contained: no real network egress in tests
    # Permit loopback + the in-process moto S3 test server (0.0.0.0); blocks external egress.
    "--allow-hosts=127.0.0.1,localhost,::1,0.0.0.0",
]
markers = [
    "unit: Unit tests with mocked dependencies (fast, no external dependencies)",
    "integration: Integration tests across multiple production boundaries",
    "benchmark: CodSpeed performance benchmarks (run separately via test-bench)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN401", # Disallow Any in function arguments
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FAST",  # FastAPI
    "FBT",   # flake8-boolean-trap
    "I",     # isort
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # Pylint
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RUF",   # Ruff-specific
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = ["PLR0913", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"*/models/*.py" = ["F401", "F811", "E501", "PLR2004", "UP007"] # Python 3.10 generated models use typing.Union for runtime forward references.
"tests/**/*.py" = [
    "PLR2004",  # Allow magic values in tests
    "SLF001",   # Allow private member access for testing internals
    "ARG001",   # Allow unused function args (pytest fixtures)
    "ARG002",   # Allow unused method args (pytest fixtures)
    "ARG005",   # Allow unused lambda args (test callbacks)
    "PLC0415",  # Allow imports inside functions (test isolation)
    "PERF401",  # Allow manual list comprehension (test clarity)
    "ASYNC251", # Allow blocking sleep in tests (test timing)
    "FBT001",   # Allow boolean positional args in tests
    "FBT002",   # Allow boolean defaults in tests
    "F841",     # Allow unused variables (intermediate test results)
    "RUF015",   # Allow list()[0] pattern (test clarity)
    "SIM105",   # Allow try/except/pass (explicit error handling)
    "B007",     # Allow unused loop variables
    "BLE001",   # Allow blind except in test cleanup
    "PIE810",   # Allow multiple starts/endswith
    "RUF043",   # Allow unescaped patterns in pytest.raises
    "RUF059",   # Allow unused unpacked variables
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Do not use Any. Define the typed boundary."
"typing_extensions.Any".msg = "Do not use Any. Define the typed boundary."
"typing.cast".msg = "Do not bypass type checking with cast. Narrow or parse into a typed model."
"typing_extensions.cast".msg = "Do not bypass type checking with cast. Narrow or parse into a typed model."

[tool.ruff.lint.isort]
known-first-party = ["dualeai"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { hpke-http = false }

[tool.vulture]
exclude = [".venv/", "build/"] # Exclude dependencies and local build artifacts
min_confidence = 80  # Ignore crap detections
sort_by_size = true  # Most impactful issues first
